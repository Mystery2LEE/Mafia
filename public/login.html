<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>마피아 - 로그인</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/login.css">
</head>
<body class="login-page">
  <div class="login-bg" aria-hidden="true"></div>
  <div class="login-beam" aria-hidden="true"></div>
  <main class="card">
    <img class="logo" src="/img/logo.svg" alt="">
    <h1>MAFIA</h1>
    <p class="tagline">누가 마피아인가 · 밤이 깊어간다</p>
    <div class="tabs">
      <button type="button" id="tab-login" class="active">로그인</button>
      <button type="button" id="tab-register">회원가입</button>
    </div>
    <form id="form" autocomplete="on">
      <label for="username">아이디</label>
      <input id="username" name="username" autocomplete="username" required>
      <label for="password">비밀번호</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required>
      <div id="nick-row" class="hidden">
        <label for="nickname">닉네임</label>
        <input id="nickname" name="nickname" autocomplete="nickname" placeholder="2~12자 (한글, 영문, 숫자, _)">
      </div>
      <button class="btn" id="submit" type="submit">로그인</button>
      <div class="msg" id="msg" role="alert"></div>
    </form>
  </main>
  <script src="/js/api.js"></script>
  <script src="/js/login.js"></script>
</body>
</html>
