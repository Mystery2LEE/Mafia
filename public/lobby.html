<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>마피아 - 로비</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/lobby.css">
</head>
<body>
  <header class="topbar">
    <img src="/img/logo.svg" alt="" class="topbar-logo">
    <span class="brand">MAFIA</span>
    <span class="topbar-me"><span id="my-crest"></span><b id="me-name"></b><span id="me-rating"></span></span>
    <nav class="nav-links">
      <a href="/ranking.html" data-icon="trophy">랭킹</a>
      <a href="/profile.html" data-icon="user">내 프로필</a>
      <a href="#" id="logout" data-icon="door">로그아웃</a>
    </nav>
  </header>

  <main class="lobby">
    <div class="lobby-head">
      <div>
        <h2>방 목록</h2>
        <p class="sub">참가할 방을 고르거나 새로 만드세요.</p>
      </div>
      <button class="btn-sm" id="open-create" type="button" data-icon="plus">방 만들기</button>
    </div>
    <div class="deco-rule"><i></i></div>

    <div id="empty" class="empty hidden">
      <div class="empty-ico" id="empty-ico"></div>
      <p>지금 열려 있는 방이 없습니다.<br>첫 번째 방을 만들어 판을 시작해 보세요.</p>
    </div>
    <ul id="rooms" class="room-list"></ul>
    <div class="msg" id="msg" role="alert"></div>
  </main>

  <dialog id="create-dialog">
    <form id="create-form" method="dialog">
      <h3>방 만들기</h3>
      <label for="c-title">방 제목</label>
      <input id="c-title" maxlength="30" required placeholder="예) 초보 환영">
      <label for="c-max">최대 인원 (4~12)</label>
      <input id="c-max" type="number" min="4" max="12" value="8" required>
      <label for="c-pw">비밀번호 (선택)</label>
      <input id="c-pw" type="password" maxlength="20" autocomplete="off" placeholder="비워 두면 공개 방">
      <label class="check"><input id="c-doctor" type="checkbox" checked> 의사 자기 보호 허용</label>
      <details>
        <summary>페이즈 시간 설정 (초, 선택)</summary>
        <div class="times">
          <label>밤 <input id="t-night" type="number" min="5" max="180" placeholder="30"></label>
          <label>토론 <input id="t-discussion" type="number" min="5" max="180" placeholder="90"></label>
          <label>투표 <input id="t-vote" type="number" min="5" max="180" placeholder="30"></label>
          <label>변론 <input id="t-defense" type="number" min="5" max="180" placeholder="20"></label>
          <label>찬반 <input id="t-verdict" type="number" min="5" max="180" placeholder="15"></label>
        </div>
      </details>
      <div class="dialog-actions">
        <button type="button" class="btn-sm ghost" data-close>취소</button>
        <button type="submit" class="btn-sm">만들기</button>
      </div>
      <div class="msg" id="create-msg" role="alert"></div>
    </form>
  </dialog>

  <dialog id="pw-dialog">
    <form id="pw-form" method="dialog">
      <h3>비밀번호 입력</h3>
      <label for="pw-input">이 방은 비밀번호가 필요합니다.</label>
      <input id="pw-input" type="password" maxlength="20" autocomplete="off" required>
      <div class="dialog-actions">
        <button type="button" class="btn-sm ghost" data-close>취소</button>
        <button type="submit" class="btn-sm">입장</button>
      </div>
      <div class="msg" id="pw-msg" role="alert"></div>
    </form>
  </dialog>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/ui.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/lobby.js"></script>
</body>
</html>
