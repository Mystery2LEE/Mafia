<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>마피아 - 게임방</title>
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/lobby.css">
  <link rel="stylesheet" href="/css/game.css">
  <link rel="stylesheet" href="/css/anim.css">
</head>
<body class="day">
  <div class="bg bg-day"></div>
  <div class="bg bg-night"></div>
  <div class="vignette"></div>

  <header class="gamebar">
    <img src="/img/logo.svg" alt="마피아" class="topbar-logo">
    <span id="room-title" class="gb-title"></span>
    <span id="phase-label" class="gb-phase"></span>
    <span id="timer" class="gb-timer"></span>
    <label class="gb-opt" title="화면 흔들림/번쩍임 같은 강한 효과를 끕니다">
      <input type="checkbox" id="reduce-motion"> 효과 줄이기
    </label>
    <button class="btn-sm ghost" id="leave" type="button">방 나가기</button>
  </header>
  <div class="timerbar"><div id="timerfill"></div></div>

  <main class="stage">
    <section class="board" id="board">
      <div id="role-card" class="role-card hidden" aria-live="polite">
        <div class="role-inner" id="role-inner">
          <div class="role-face role-front"><span>?</span></div>
          <div class="role-face role-back"><img id="role-img" alt=""></div>
        </div>
        <div id="role-name" class="role-name"></div>
        <div id="role-mates" class="role-mates"></div>
      </div>

      <div id="ring" class="ring"></div>
      <div class="center" id="center">
        <div id="center-msg" class="center-msg"></div>
        <div id="actions" class="actions"></div>
      </div>
    </section>

    <aside class="chat">
      <div id="tabs" class="chat-tabs" role="tablist"></div>
      <ul id="log" class="chat-log" aria-live="polite"></ul>
      <form id="chat-form" class="chat-form" autocomplete="off">
        <input id="chat-input" maxlength="200" placeholder="메시지 입력">
        <button class="btn-sm" type="submit">전송</button>
      </form>
    </aside>
  </main>

  <div id="over" class="overlay hidden">
    <div class="over-card">
      <h2 id="over-title"></h2>
      <ul id="over-roles" class="over-roles"></ul>
      <div id="over-rating" class="over-rating"></div>
      <button class="btn" id="over-close" type="button">대기실로</button>
    </div>
  </div>

  <div id="fx" class="fx" aria-hidden="true"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/anim.js"></script>
  <script src="/js/room.js"></script>
</body>
</html>
