<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>마피아 - 내 프로필</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="/css/base.css">
  <link rel="stylesheet" href="/css/lobby.css">
  <link rel="stylesheet" href="/css/stats.css">
  <link rel="stylesheet" href="/css/skins.css">
  <script src="/js/skin.js"></script>
</head>
<body>
  <header class="topbar">
    <img src="/img/logo.svg" alt="" class="topbar-logo">
    <span class="brand">MAFIA</span>
    <span class="topbar-me"></span>
    <nav class="nav-links">
      <a href="/lobby.html" data-icon="list">로비</a>
      <a href="/ranking.html" data-icon="trophy">랭킹</a>
      <a href="/profile.html" class="current" data-icon="user">내 프로필</a>
    </nav>
  </header>
  <main class="page">
    <section class="hero panel deco">
      <div class="hav-wrap">
        <button type="button" class="hav-btn" id="hav-btn" aria-label="프로필 사진 변경">
          <div class="hav" id="hav"></div>
          <span class="cam" id="hav-cam"></span>
        </button>
        <input type="file" id="hav-file" accept="image/*" hidden>
        <div class="hav-actions"><button type="button" id="hav-change">사진 변경</button><button type="button" id="hav-reset" hidden>기본으로</button></div>
        <div class="hav-msg" id="hav-msg" role="status"></div>
      </div>
      <div>
        <div class="hname" id="nick"></div>
        <div class="hmeta"><span id="tier" class="tier"></span><span id="rank"></span></div>
      </div>
      <div class="crest-big" id="crest"></div>
    </section>

    <div class="stat-grid">
      <div class="stat"><span>레이팅</span><b id="rating"></b></div>
      <div class="stat"><span>전적</span><b id="record"></b></div>
      <div class="stat"><span>승률</span><b id="winrate"></b></div>
    </div>
    <div class="progress-wrap">
      <div class="lbl"><span id="cur-label"></span><span id="next-label"></span></div>
      <div class="progress"><i id="progress"></i></div>
    </div>

    <div class="stat-grid sm">
      <div class="stat"><span>현재 흐름</span><b id="streak"></b></div>
      <div class="stat"><span>최고 연승</span><b id="best-streak"></b></div>
      <div class="stat"><span>생존율</span><b id="survival"></b></div>
      <div class="stat"><span>이탈</span><b id="left-early"></b></div>
    </div>

    <h3 class="sec" data-icon="trophy">레이팅 추이 <small class="sec-note">최근 30경기</small></h3>
    <div class="chart-box" id="chart"></div>

    <h3 class="sec" data-icon="fedora">팀 · 직업별 승률</h3>
    <div id="teams" class="role-rows"></div>
    <div id="roles" class="role-rows"></div>

    <h3 class="sec" data-icon="list">최근 경기 <small class="sec-note">눌러서 상세 보기</small></h3>
    <table class="table">
      <thead><tr><th>날짜</th><th>방</th><th>직업</th><th>결과</th><th class="num">레이팅</th></tr></thead>
      <tbody id="recent"></tbody>
    </table>
    <button class="btn-sm ghost more-btn" id="more" type="button" hidden>더 보기</button>
    <div class="msg" id="msg"></div>
  </main>

  <div id="md" class="modal hidden" role="dialog" aria-modal="true" aria-labelledby="md-title">
    <div class="modal-card panel deco">
      <button class="modal-x" id="md-x" type="button" aria-label="닫기">×</button>
      <h3 id="md-title"></h3>
      <div class="md-sub" id="md-sub"></div>
      <table class="table md-table">
        <thead><tr><th>플레이어</th><th>직업</th><th>결과</th><th class="num">점수</th></tr></thead>
        <tbody id="md-rows"></tbody>
      </table>
    </div>
  </div>
  <script src="/js/ui.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/profile.js"></script>
</body>
</html>
